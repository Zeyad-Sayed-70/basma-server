name: Deploy Backend

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'ecosystem.config.js'
      - 'deploy/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if [ ! -d /opt/basma-app ]; then
              git clone https://github.com/${{ github.repository }}.git /opt/basma-app
            fi
            cd /opt/basma-app
            if [ ! -f .env ]; then
              cp deploy/.env.production.example .env
              echo "WARNING: .env created from template — edit it with real secrets and restart"
            fi
            git pull origin master
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart basma-api || pm2 start ecosystem.config.js --only basma-api
            pm2 save
