name: Deploy Backend

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'ecosystem.config.js'
      - 'deploy/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure target directory exists
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p /opt/basma-app

      - name: Copy code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: '.'
          target: /opt/basma-app
          strip_components: 0
          rm: true
          tar_tmp_path: /tmp/
          tar_exec: tar
          overwrite: true
          exclude: '.git,node_modules,dist,.next,*.log'

      - name: Build & restart on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/basma-app

            if [ ! -f .env ]; then
              cp deploy/.env.production.example .env
              echo "WARNING: .env created from template — edit it with real secrets and restart"
            fi

            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart basma-api || pm2 start ecosystem.config.js --only basma-api
            pm2 save
