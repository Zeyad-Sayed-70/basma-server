# Run: docker compose -f docker-compose.infra.yml up -d
# Keeps PostgreSQL, Redis, and MinIO on internal ports to avoid conflicts.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: basma
      POSTGRES_USER: basma
      POSTGRES_PASSWORD: ${DB_PASSWORD:-basma_secret}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - basma-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - basma-redis:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-basma}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-basma_secret}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - basma-minio:/data

volumes:
  basma-postgres:
  basma-redis:
  basma-minio:
