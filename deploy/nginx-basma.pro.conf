# Place in /etc/nginx/sites-available/basma.pro
# Then: ln -sf /etc/nginx/sites-available/basma.pro /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx

# ─── Frontend (Next.js SSR on port 3100) ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name basma.pro www.basma.pro;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name basma.pro www.basma.pro;

    ssl_certificate     /etc/letsencrypt/live/basma.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/basma.pro/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── API (NestJS on port 3099) ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.basma.pro;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.basma.pro;

    ssl_certificate     /etc/letsencrypt/live/basma.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/basma.pro/privkey.pem;

    client_max_body_size 500M;

    location /assets/ {
        proxy_pass http://127.0.0.1:9002/basma-assets/;
        proxy_set_header Host 127.0.0.1:9002;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

# ─── Wildcard teacher subdomains ───────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.basma.pro;

    ssl_certificate     /etc/letsencrypt/live/basma.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/basma.pro/privkey.pem;

    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
